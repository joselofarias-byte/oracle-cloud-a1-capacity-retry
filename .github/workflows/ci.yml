name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Validate shell syntax
        run: bash -n oci_capacity_retry.sh bootstrap_oci_network.sh termux.sh activar-actions.sh

      - name: Compile Python
        run: python -m py_compile oracle_free_tier_checker.py configurar.py actions_a1.py

      - name: Run shell dry-run
        env:
          ENV_FILE: .env.example
          DRY_RUN: "1"
        run: ./oci_capacity_retry.sh

      - name: Run Python dry-run
        env:
          # The dry-run only renders commands; it never invokes OCI CLI.
          # Use a runner-independent executable so CI does not require OCI CLI.
          OCI_BIN: /bin/echo
        run: python oracle_free_tier_checker.py --env-file .env.example --dry-run

      - name: Pruebas de regresión con OCI simulado
        run: |
          pip install oci==2.187.2
          python -m unittest discover -s tests -v
